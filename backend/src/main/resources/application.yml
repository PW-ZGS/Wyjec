server:
  port: ${PORT:8081}
  shutdown: graceful

spring:
  application:
    name: siren-backend
  profiles:
    default: demo
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:siren}
    username: ${DB_USER:siren}
    password: ${DB_PASSWORD:siren}
  flyway:
    locations: classpath:migrations
  jackson:
    default-property-inclusion: non_null
  mvc:
    async:
      request-timeout: -1

management:
  endpoints:
    web:
      exposure:
        include: health

siren:
  # Alarm events older than key_epoch.valid_to + grace are rejected as stale.
  alarm-grace: PT24H
  # Accepted clock skew for signed timestamps and device request signatures.
  max-clock-skew: PT5M
  position-retention: PT24H
  key-epoch-validity: P30D
  demo:
    enabled: false
